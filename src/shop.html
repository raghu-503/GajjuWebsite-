<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Shop robots and kits · Gajju</title>
    <meta
      name="description"
      content="Shop GAJJU, the DIY quadruped robot kit with a trunk that grips."
    />
    <meta name="theme-color" content="#f8f4ec" />
    <script>
      try {
        if (JSON.parse(localStorage.getItem("Gajju:theme")) === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content =
            "#05070a";
        }
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M20 2.5 35.2 11.25v17.5L20 37.5 4.8 28.75v-17.5Z' fill='%2305070a' stroke='white' stroke-width='2'/><path d='M25.5 15.2A7 7 0 1 0 27 20.5H20.5' fill='none' stroke='%233de8ff' stroke-width='3' stroke-linecap='round'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,100,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="main" class="page">
      <div class="mx-auto max-w-[1120px] px-(--pad)">
        <header class="mb-6 flex flex-wrap items-start justify-between gap-4">
          <div>
            <h1 class="text-step-2 font-bold">Shop All Products</h1>
            <p class="mt-[0.4rem] text-muted">
              Explore our robotics products and engineering kits.
            </p>
          </div>
          <nav class="text-[0.88rem] text-muted" aria-label="Breadcrumb">
            <a class="hover:text-accent" href="index.html">Home</a> /
            <span class="text-fg" aria-current="page">Shop</span>
          </nav>
        </header>
        <div class="mb-5 flex items-center justify-between gap-4">
          <strong data-count></strong>
          <label
            class="inline-flex items-center gap-[0.35rem] rounded-full border border-line bg-surface px-[0.8rem] py-[0.35rem] text-[0.86rem] font-semibold"
          >
            <span>Sort:</span>
            <select
              class="cursor-pointer border-0 bg-transparent font-semibold outline-none [&_option]:bg-surface"
              data-sort
              aria-label="Sort products"
            >
              <option value="featured">Featured</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
            </select>
          </label>
        </div>
        <div data-listing></div>
      </div>
    </main>
    <script type="module" src="./js/shop.js"></script>
  </body>
</html>
