<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Product · Gajju</title>
    <meta
      name="description"
      content="Product details, specifications and reviews."
    />
    <meta name="theme-color" content="#f8f4ec" />
    <script>
      try {
        if (JSON.parse(localStorage.getItem("Gajju:theme")) === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content =
            "#05070a";
        }
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M20 2.5 35.2 11.25v17.5L20 37.5 4.8 28.75v-17.5Z' fill='%2305070a' stroke='white' stroke-width='2'/><path d='M25.5 15.2A7 7 0 1 0 27 20.5H20.5' fill='none' stroke='%233de8ff' stroke-width='3' stroke-linecap='round'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,100,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="main" class="page">
      <div class="wrap" data-pdp></div>
    </main>
    <script type="module" src="./js/product-page.js"></script>
  </body>
</html>
